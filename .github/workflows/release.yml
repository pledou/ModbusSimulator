name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/bun@v2

      - name: Install dependencies (bun)
        run: bun install

      - name: Run tests (e2e)
        run: bun run test:e2e

      - name: Build release (linux)
        run: bun run build

      - name: Package linux artifacts
        run: |
          tar -czf linux-release.tar.gz -C Releases .

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: linux-release.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/bun@v2

      - name: Install dependencies (bun)
        run: bun install

      - name: Run tests (e2e)
        run: bun run test:e2e

      - name: Build release (windows)
        run: bun run build

      - name: Package windows artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path "Releases/*" -DestinationPath windows-release.zip

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.zip

  create-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Linux bundle
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: linux-release.tar.gz
          asset_name: linux-release.tar.gz
          asset_content_type: application/gzip

      - name: Upload Windows bundle
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: windows-release.zip
          asset_name: windows-release.zip
          asset_content_type: application/zip
